<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PostgreSQL MCQ Quiz</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<style>
:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --muted:#64748b;
  --text:#0f172a;
  --accent:#22c55e;
  --warn:#f59e0b;
  --danger:#ef4444;
  --btn:#e5e7eb;
  --btn2:#0ea5e9;
  --border:#e2e8f0;
  --page1:#f8fafc;
  --page2:#e2e8f0;
  --optbg:#f8fafc;
  --optHover:#f1f5f9;
  --reportbg:#ffffff;
  --shadow:0 10px 25px rgba(0,0,0,.08);
}

/* dark mode */
html[data-theme="dark"]{
  --bg:#0f172a;
  --card:#111827;
  --muted:#94a3b8;
  --text:#e5e7eb;
  --btn:#1f2937;
  --border:#1f2937;
  --page1:#0b1220;
  --page2:#0f172a;
  --optbg:#0b1220;
  --optHover:#111827;
  --reportbg:#111827;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial;
  background:linear-gradient(180deg,var(--page1),var(--page2));
  color:var(--text);
  padding:24px;
}

.container{max-width:980px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.title{font-size:20px;font-weight:700}
.muted{color:var(--muted);font-size:13px}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  box-shadow:var(--shadow);
}

.row{display:flex;gap:12px;flex-wrap:wrap}
.spacer{height:8px}

.progress{
  height:8px;
  background:rgba(148,163,184,.3);
  border-radius:999px;
  overflow:hidden;
  border:1px solid var(--border);
}
.bar{height:100%;background:linear-gradient(90deg,#0ea5e9,#22c55e);width:0%}

.qtext{font-size:18px;font-weight:600;line-height:1.45}
.opts{display:grid;gap:10px;margin-top:12px}

.opt{
  display:flex;
  gap:10px;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--optbg);
  cursor:pointer;
}
.opt:hover{background:var(--optHover)}
.opt input{accent-color:var(--accent);transform:scale(1.15)}

.opt.correct{border-color:#22c55e;background:rgba(16,185,129,.12)}
.opt.wrong{border-color:#ef4444;background:rgba(239,68,68,.12)}

.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}

.btn{
  background:var(--btn);
  color:var(--text);
  border:1px solid var(--border);
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
}
.btn.primary{background:#0ea5e9;color:#fff;border-color:#0284c7}
.btn.warn{background:#f59e0b;border-color:#d97706;color:#000}
.btn.ghost{background:transparent}

.pill{
  padding:6px 10px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--optbg);
  font-size:12px;
  font-weight:600;
}

textarea{
  width:100%;
  min-height:160px;
  background:var(--card);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  font-family:ui-monospace,monospace;
}

details{border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--card)}
summary{cursor:pointer;font-weight:700}

#report{display:none;margin-top:20px;padding:15px;border:1px solid var(--border);border-radius:12px;background:var(--reportbg)}

.toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
  user-select: none;
}
.toggle input {
  accent-color: var(--accent);
}

</style>
</head>

<body>
<div class="container">

<div class="header">
  <div>
    <div class="title">PostgreSQL MCQ Practice</div>
    <div class="muted">answers stay hidden until you click Show answer</div>
  </div>
  <div class="row">
    <button class="btn ghost" id="themeBtn" type="button">Light / Dark</button>
    
  <label class="toggle">
    <input type="checkbox" id="toggleScore" checked>
    Show score
  </label>
  <div class="pill" id="score">Score: 0 / 0</div>
  </div>
</div>

<div class="row" style="margin-bottom:12px;">
  <label>Number of questions:</label>
  <select id="qcount">
    <option>10</option>
    <option>20</option>
    <option selected>30</option>
    <option>50</option>
  </select>
  <button class="btn primary" id="generateBtn">Generate Quiz</button>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between">
    <div class="muted">Progress</div>
    <div class="muted"><span id="ctr">1</span> / <span id="total">0</span></div>
  </div>
  <div class="progress"><div class="bar" id="bar"></div></div>

  <div class="spacer"></div>
  <div class="qtext" id="qtext"></div>
  <div class="opts" id="opts"></div>

  <div class="foot">
    <div class="row">
      <button class="btn" id="prevBtn">Prev</button>
      <button class="btn" id="nextBtn">Next</button>
      <button class="btn primary" id="checkBtn">Check</button>
      <button class="btn warn" id="revealBtn">Show answer</button>
      <button class="btn ghost" id="resetBtn">Reset</button>
      <button class="btn primary" id="finishBtn">Finish</button>
    </div>
    <div class="muted" id="feedback"></div>
  </div>
</div>

<div id="report"></div>

<details style="margin-top:20px">
<summary>Import / Export questions (JSON)</summary>
<div class="spacer"></div>
<button class="btn" id="exportBtn">Export</button>
<button class="btn" id="importBtn">Import</button>
<div class="spacer"></div>
<textarea id="jsonArea" placeholder='[{ "q":"...", "opts":["A","B","C","D"], "ans":1 }]'></textarea>
</details>

</div>

<script>
/* THEME */
const KEY="pg_theme";
const apply=t=>document.documentElement.setAttribute("data-theme",t);
const init=()=>apply(localStorage.getItem(KEY) || (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
init();
themeBtn.onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";apply(t);localStorage.setItem(KEY,t);};

/* QUIZ */
const QUESTIONS=[],selected=[],revealed=[];
let ACTIVE=[],idx=0;

const qtext=Q("qtext"),opts=Q("opts"),ctr=Q("ctr"),total=Q("total"),bar=Q("bar"),score=Q("score"),fb=Q("feedback"),toggleScore=Q("toggleScore");
if (toggleScore) {
  toggleScore.addEventListener("change", () => {
    score.style.display = toggleScore.checked ? "inline-flex" : "none";
  });
  // initialize
  score.style.display = toggleScore.checked ? "inline-flex" : "none";
}


function Q(id){return document.getElementById(id)}
function uniq(a){const s=new Set();return a.filter(q=>!s.has(q.q)&&s.add(q.q))}
function pick(n){return uniq(QUESTIONS).sort(()=>Math.random()-.5).slice(0,n)}

function render(){
  if(!ACTIVE.length)return;
  const q=ACTIVE[idx];
  ctr.textContent=idx+1;
  bar.style.width=((idx+1)/ACTIVE.length*100)+"%";
  qtext.textContent=q.q;
  opts.innerHTML="";
  q.opts.forEach((o,i)=>{
    const l=document.createElement("label");
    l.className="opt";
    if(revealed[idx]){
      if(i===q.ans)l.classList.add("correct");
      else if(selected[idx]===i)l.classList.add("wrong");
    }
    l.innerHTML=`<input type="radio" name="o" ${selected[idx]===i?"checked":""}> ${"ABCD"[i]}. ${o}`;
    l.onclick=()=>{selected[idx]=i;render()};
    opts.appendChild(l);
  });
  score.textContent=`Score: ${selected.filter((v,i)=>v===ACTIVE[i].ans).length} / ${selected.filter(v=>v!=null).length}`;
}

prevBtn.onclick=()=>{if(idx>0)idx--;render()}
nextBtn.onclick=()=>{if(idx<ACTIVE.length-1)idx++;render()}
checkBtn.onclick=()=>fb.textContent=selected[idx]==null?"Select an option first.":(selected[idx]===ACTIVE[idx].ans?"Correct.":"Incorrect. Answer hidden.")
revealBtn.onclick=()=>{revealed[idx]=!revealed[idx];render()}
resetBtn.onclick=()=>{selected.fill(null);revealed.fill(false);idx=0;render()}
finishBtn.onclick=()=>{
  let h=`<h2>Quiz Report</h2><p>Score: ${selected.filter((v,i)=>v===ACTIVE[i].ans).length} / ${ACTIVE.length}</p>`;
  ACTIVE.forEach((q,i)=>h+=`<p><b>Q${i+1}:</b> ${q.q}<br>Your answer: ${selected[i]!=null?q.opts[selected[i]]:"None"}<br>Correct: ${q.opts[q.ans]}</p>`);
  report.innerHTML=h;report.style.display="block";scrollTo(0,report.offsetTop);
};

exportBtn.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(QUESTIONS,null,2)]));a.download="questions.json";a.click();}
importBtn.onclick=()=>{
  try{
    const a=JSON.parse(jsonArea.value);QUESTIONS.length=0;a.forEach(q=>QUESTIONS.push(q));
    ACTIVE=pick(+qcount.value);idx=0;selected.length=ACTIVE.length;revealed.length=ACTIVE.length;
    selected.fill(null);revealed.fill(false);total.textContent=ACTIVE.length;render();
  }catch(e){alert(e.message)}
};
generateBtn.onclick=()=>{ACTIVE=pick(+qcount.value);idx=0;selected.length=ACTIVE.length;revealed.length=ACTIVE.length;selected.fill(null);revealed.fill(false);total.textContent=ACTIVE.length;render()};
</script>
</body>
</html>
